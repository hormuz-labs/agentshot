# AgentShot in Claude and ChatGPT on the web (chat-host/README.md), next to the account service. Its code and the editor
# page come from ConfigMaps (gateway/k8s/deploy-chat-host.sh). A Tailscale sidecar puts the pod on the mesh (Headscale),
# where the cloud workers are.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-host
  namespace: manul
spec:
  # Any copy answers any request: a video or upload link carries what's needed to lease the person's worker (sealed
  # with LINK_SECRET, the same in every copy), so nothing depends on which copy made the link, or on it still running.
  replicas: 2
  selector:
    matchLabels: { app: chat-host }
  template:
    metadata:
      labels: { app: chat-host }
    spec:
      nodeSelector: { pool: system }
      containers:
        - name: chat-host
          image: node:24.11.1-alpine
          command: [node, /app/server.mjs]
          securityContext: { runAsNonRoot: true, runAsUser: 1000 }
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: PUBLIC_URL, value: https://mcp.agentshot.si }
            - { name: CLERK_ISSUER, value: https://clerk.agentshot.si }
            - { name: ACCOUNT_URL, value: "http://account:8080" }
            - { name: EDITOR_PAGE, value: /page/editor.html }
            - { name: LINK_SECRET, valueFrom: { secretKeyRef: { name: manul-secrets, key: CHAT_LINK_SECRET } } }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: page, mountPath: /page, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # on the mesh: the workers' addresses (mesh.manul.internal) route through this node
        - name: mesh
          image: tailscale/tailscale:v1.80.3
          securityContext: { capabilities: { add: [NET_ADMIN] } }
          env:
            - { name: TS_AUTHKEY, valueFrom: { secretKeyRef: { name: manul-secrets, key: CHAT_MESH_AUTHKEY } } }
            # tag:client: the mesh lets clients reach the workers' bridge (headscale acl.json)
            - { name: TS_EXTRA_ARGS, value: "--login-server=http://headscale:8080 --advertise-tags=tag:client" }
            - { name: TS_USERSPACE, value: "false" }
            - { name: TS_STATE_DIR, value: /var/lib/tailscale }
            - { name: TS_KUBE_SECRET, value: "" }   # state in the folder above, not a Kubernetes Secret (no RBAC for that)
            - { name: TS_HOSTNAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
            - { name: mesh-state, mountPath: /var/lib/tailscale }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
      volumes:
        - name: code
          configMap: { name: chat-host-code }
        - name: page
          configMap: { name: chat-host-page }
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: mesh-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-host
  namespace: manul
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "chat-host"}'
spec:
  selector: { app: chat-host }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# the load balancer checks /healthz; an upload or a long tool call may take minutes
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: chat-host
  namespace: manul
spec:
  healthCheck: { port: 8080, requestPath: /healthz, type: HTTP }
  timeoutSec: 3600
---
# mcp.agentshot.si's certificate, on the shared load balancer (the manul Ingress names it)
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: chat-host
  namespace: manul
spec:
  domains: [mcp.agentshot.si]
---
# Its own load balancer (not the shared manul Ingress), so it comes and goes on its own. mcp.agentshot.si points at
# its address (kubectl -n manul get ingress chat-host), DNS only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-host
  namespace: manul
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: chat-host
spec:
  defaultBackend:
    service: { name: chat-host, port: { number: 8080 } }
