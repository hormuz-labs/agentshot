# Keeps the site's download links on the latest AgentShot release: when a new release ships, this writes
# site/src/release.json and triggers the site build. Hourly, like the Homebrew tap.
name: Follow AgentShot releases for site
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: site-release
  cancel-in-progress: false
jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(gh api repos/hormuz-labs/agentshot/releases/latest --jq .tag_name | sed 's/^v//')
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("site/src/release.json", JSON.stringify({ version: process.argv[1] }) + "\n")' "$v"
          git diff --quiet -- site/src/release.json && { echo "already on $v"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/release.json
          git commit -m "site: AgentShot $v"
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN does not trigger another push workflow.
          gh workflow run site.yml --ref main
