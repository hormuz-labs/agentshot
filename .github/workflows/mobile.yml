name: Mobile checks
on:
  pull_request:
    paths: ['mobile/**', 'scripts/mesh/**', 'scripts/build-mesh.sh', 'src/main/mobile-*.ts', 'test/mobile-bridge.test.ts', '.github/workflows/mobile.yml']
  push:
    paths: ['mobile/**', 'scripts/mesh/**', 'scripts/build-mesh.sh', 'src/main/mobile-*.ts', 'test/mobile-bridge.test.ts', '.github/workflows/mobile.yml']
  workflow_dispatch:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/mesh/go.mod
          cache-dependency-path: scripts/mesh/go.sum
      - name: Build the embedded mesh node (gomobile)
        run: ./scripts/build-mesh.sh android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: manul-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build ios --simulator --no-codesign
        working-directory: mobile
