name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake xvfb
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - run: npm ci
      - name: Build bundled whisper.cpp
        run: ./scripts/build-whisper.sh
      - name: Build the bundled beat tracker
        run: ./scripts/build-beats.sh
      - name: Build the bundled model runners (speakers, vision)
        run: ./scripts/build-ml.sh
      - run: npm run typecheck
      - run: npm test
      # Electron 44 downloads its executable lazily; do not let the E2E launch timeout include that download.
      - name: Prepare Electron for end-to-end tests
        run: node -e "require('electron')"
      - name: End-to-end (macOS)
        if: runner.os == 'macOS'
        run: npx electron-vite build && node test/e2e/filmstrip.e2e.mjs && node test/e2e/clips.e2e.mjs && node test/e2e/menu.e2e.mjs
      - name: End-to-end (Linux, virtual display)
        if: runner.os == 'Linux'
        run: npx electron-vite build && xvfb-run -a node test/e2e/filmstrip.e2e.mjs && xvfb-run -a node test/e2e/clips.e2e.mjs && xvfb-run -a node test/e2e/menu.e2e.mjs

  # The phone app (mobile/): its types, and that Metro bundles it, ../src/shared included
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-export"
        env:
          CI: 1
