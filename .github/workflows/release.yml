# A tag like v0.2.0 → build, sign and notarize (macOS) on five native runners, then publish ONE GitHub release
# (the auto-update feed) with every build's files and generated notes, and rebuild the apt repository (apt.yml).
# Runs when a tag is pushed by hand, or when tag.yml tags a merge to main and calls it with that tag (a tag pushed by a
# workflow doesn't start other workflows).
# The Homebrew tap (hormuz-labs/homebrew-tap) picks up new releases on its own.
# Builds don't publish themselves: parallel uploads made duplicate releases and one Mac feed overwrote the other.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: the tag to release, e.g. v0.4.1 (already pushed)
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64, shell: bash }
          - { os: macos-15-intel, arch: x64, shell: bash }
          - { os: ubuntu-24.04, arch: x64, shell: bash }
          - { os: ubuntu-24.04-arm, arch: arm64, shell: bash }
          - { os: windows-2022, arch: x64, shell: pwsh }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake rpm
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Require public Windows signing configuration
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          MANUL_PUBLIC_RELEASE: '1'
        run: node --input-type=module -e "import { windowsSigning } from './scripts/package.mjs'; windowsSigning()"
      - name: Require macOS signing and notarization configuration
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 && 'set' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MANUL_PUBLIC_RELEASE: '1'
        run: node --input-type=module -e "import { macSigning } from './scripts/package.mjs'; macSigning()"
      - name: App Store Connect API key for notarization (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run build:whisper
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version-file: scripts/mesh/go.mod
          cache-dependency-path: scripts/mesh/go.sum
      - name: Build the bundled beat tracker, model runners and mesh node (Unix)
        if: runner.os != 'Windows'
        run: |
          ./scripts/build-beats.sh
          ./scripts/build-ml.sh
          ./scripts/build-mesh.sh
      - name: Verify target-native tools and models before release
        if: runner.os != 'Windows'
        run: npm run check:native
      - name: Inspect bundled Windows executable dependencies
        if: runner.os == 'Windows'
        run: ./scripts/check-windows-dependencies.ps1
      - name: Version from the tag
        run: npm run version:tag
      - run: npm run test:packaging
      - run: npm run typecheck
      - run: npm test
      - name: Windows runtime end-to-end
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: |
          node -e "require('electron')"
          if ($LASTEXITCODE -ne 0) { throw 'Electron download failed' }
          npx electron-vite build
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build failed' }
          foreach ($test in @('filmstrip', 'clips', 'browser', 'export', 'menu')) {
            node "test/e2e/$test.e2e.mjs"
            if ($LASTEXITCODE -ne 0) { throw "$test E2E failed" }
          }
      - name: Build, sign, notarize
        env:
          # crash reports and usage statistics, both opt-in (telemetry/README.md); unset, the build has neither
          MANUL_TELEMETRY_URL: ${{ vars.MANUL_TELEMETRY_URL }}
          MANUL_POSTHOG_TOKEN: ${{ vars.MANUL_POSTHOG_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          MANUL_PUBLIC_RELEASE: '1'
        run: npm run package
      - name: Verify Windows signatures and update feed
        if: runner.os == 'Windows'
        env:
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          ./scripts/check-windows-signatures.ps1
          node scripts/check-windows-feed.mjs
      - name: Windows packaged app and installer smoke
        if: runner.os == 'Windows'
        run: |
          node test/e2e/packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked app E2E failed' }
          ./scripts/smoke-windows-installer.ps1
      - name: Verify the Mac app is signed, notarized and opens without a Gatekeeper warning
        if: runner.os == 'macOS'
        run: ./scripts/check-mac-signature.sh dist
      - name: Rename the Mac feed so the two architectures don't collide
        if: runner.os == 'macOS'
        run: mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.arch }}.part.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: out
      - name: One Mac feed for both architectures and stable download names for agentshot.si
        run: |
          node scripts/merge-mac-feed.mjs out/latest-mac-*.part.yml > out/latest-mac.yml
          rm out/latest-mac-*.part.yml out/builder-debug.yml 2>/dev/null || true
          cat out/latest-mac.yml
          cp out/AgentShot-*-windows-x64-Setup.exe out/AgentShot-windows-x64-Setup.exe
          cp out/AgentShot-*-arm64.dmg out/AgentShot-arm64.dmg
          cp out/AgentShot-*-x64.dmg out/AgentShot-x64.dmg
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" out/* --title "${TAG#v}" --generate-notes --verify-tag

  apt:
    needs: publish
    if: ${{ vars.APT_GPG_KEY_ID != '' }}
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
