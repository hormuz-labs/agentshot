# A tag like v0.2.0 → build, sign and notarize (macOS) on four runners, then publish ONE GitHub release
# (the auto-update feed) with every build's files and generated notes, and rebuild the apt repository (apt.yml).
# Runs when a tag is pushed by hand, or when tag.yml tags a merge to main and calls it with that tag (a tag pushed by a
# workflow doesn't start other workflows).
# The Homebrew tap (hormuz-labs/homebrew-tap) picks up new releases on its own.
# Builds don't publish themselves: parallel uploads made duplicate releases and one Mac feed overwrote the other.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: the tag to release, e.g. v0.4.1 (already pushed)
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64, target: --mac }
          - { os: macos-15-intel, arch: x64, target: --mac }
          - { os: ubuntu-24.04, arch: x64, target: --linux }
          - { os: ubuntu-24.04-arm, arch: arm64, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake rpm
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - run: npm ci
      - run: ./scripts/build-whisper.sh
      - run: ./scripts/build-beats.sh
      - run: ./scripts/build-ml.sh
      - name: Verify target-native tools and models before release
        run: npm run check:native
      - name: Version from the tag
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm test
      - name: Build, sign, notarize
        env:
          # crash reports and usage statistics, both opt-in (telemetry/README.md); unset, the build has neither
          MANUL_TELEMETRY_URL: ${{ vars.MANUL_TELEMETRY_URL }}
          MANUL_POSTHOG_TOKEN: ${{ vars.MANUL_POSTHOG_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-vite build
          # an empty CSC_LINK makes electron-builder read the project folder as the certificate: unset what isn't configured
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || unset "$v"; done
          NOTARIZE=false
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_ID" ]; then NOTARIZE=true; fi
          npx electron-builder ${{ matrix.target }} --${{ matrix.arch }} --publish never -c.mac.notarize=$NOTARIZE
      - name: Rename the Mac feed so the two architectures don't collide
        if: runner.os == 'macOS'
        run: mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.arch }}.part.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.deb
            dist/*.AppImage
            dist/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: out
      - name: One Mac feed for both architectures
        run: |
          node scripts/merge-mac-feed.mjs out/latest-mac-*.part.yml > out/latest-mac.yml
          rm out/latest-mac-*.part.yml out/builder-debug.yml 2>/dev/null || true
          cat out/latest-mac.yml
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" out/* --title "${TAG#v}" --generate-notes --verify-tag

  apt:
    needs: publish
    if: ${{ vars.APT_GPG_KEY_ID != '' }}
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
