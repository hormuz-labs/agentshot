apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: manul
spec:
  replicas: 1 # The directory and tunnel rendezvous share process-local state.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: relay }
  template:
    metadata:
      labels: { app: relay }
    spec:
      nodeSelector: { pool: system }
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: relay
          image: node:24.11.1-alpine
          command: [node, /app/relay.mjs]
          ports: [{ name: http, containerPort: 8091 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8091" }
            - { name: CLERK_ISSUER, value: "https://clerk.manul.si" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: code
          configMap: { name: relay-code }
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: manul
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "relay"}'
spec:
  selector: { app: relay }
  ports: [{ name: http, port: 8091, targetPort: http }]
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: relay
  namespace: manul
spec:
  timeoutSec: 3600
  healthCheck: { type: HTTP, requestPath: /healthz, port: 8091 }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: manul-relay
  namespace: manul
spec:
  domains: [relay.manul.si]
